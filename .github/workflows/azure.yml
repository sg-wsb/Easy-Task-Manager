name: Build, Test and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
     
      - name: Checkout code
        uses: actions/checkout@v3

      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      
      - name: Restore backend
        run: dotnet restore ./backend/backend.csproj

     
      - name: Build backend
        run: dotnet build ./backend/backend.csproj --configuration Release

     
      - name: Run tests
        run: dotnet test ./backend.Tests/backend.Tests.csproj --verbosity normal

      
      - name: Publish
        run: dotnet publish ./backend/backend.csproj -c Release -o publish

      
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: task-api-seba-123
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish