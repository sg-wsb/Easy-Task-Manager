name: Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy web.config
        run: |
          cp frontend/web.config frontend/dist/web.config

      - name: Create ZIP
        run: |
          cd frontend/dist
          zip -r app.zip .

      - name: Deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: task-frontend-seba-123
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: frontend/dist/app.zip