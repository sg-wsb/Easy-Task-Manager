name: Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy web.config
        run: cp frontend/web.config frontend/dist/

      - name: Clean output (WAŻNE)
        run: |
          rm -rf frontend/dist/node_modules
          rm -f frontend/dist/package.json
          rm -f frontend/dist/server.js

      - name: Deploy ONLY dist
        uses: azure/webapps-deploy@v2
        with:
          app-name: task-frontend-seba-123
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: frontend/dist